name: Deploy to Cloudflare Pages

# Durora Music Festival 2026 — Next.js 16 + React 19 + Tailwind 4, static export.
# Build + check on every push / PR to main. Deploy to Cloudflare Pages only
# after the build job passes, and only on push to main. Deploy uses the
# pre-built `out/` output from the build job, so exactly what was tested
# is what goes live.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with Cloudflare Pages:Edit + Account:Read
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID (Dashboard → Account ID)
# A Cloudflare Pages project named `durora` must exist (Dashboard →
# Workers & Pages → Create → Pages → Direct Uploads → project name
# `durora`), or the first deploy creates it via Wrangler.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build static site
        run: npm run build
      - name: Check prerendered output
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/og.jpg
          echo "prerendered output OK"
      - name: Upload build output for deploy
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: durora-build
          path: out

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: durora-build
          path: out
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name durora --commit-dirty=true
